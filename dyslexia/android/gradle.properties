org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:-UseContainerSupport
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.reshaping=true
android.nonTransitiveRClass=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation builds relative paths between plugin sources
# (pub cache on C:) and this project (D:). Windows has no relative path across
# drive roots, so the incremental cache throws "different roots" and the build
# dies. Disable it — plugin Kotlin is compiled once and cached by Gradle anyway.
kotlin.incremental=false
